name: Prueba Weathercloud
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install weathercloud==0.1.5
      - name: Consultar Hard Kraft
        run: |
          python - <<'PY'
          from weathercloud import WeathercloudClient
          from datetime import datetime, timezone
          ok = False
          with WeathercloudClient() as client:
              for station in ("d5053285441", "5053285441"):
                  print("Probando:", station, flush=True)
                  try:
                      c = client.get_current_conditions(station)
                      print("Respuesta:", repr(c))
                      for k in ("temperature", "epoch", "humidity", "pressure", "wind_speed", "wind_gust", "wind_direction", "rain", "solar_radiation", "uv_index"):
                          print(k, getattr(c, k, None))
                      if c.temperature is not None and c.epoch is not None:
                          ok = True
                          break
                  except Exception as e:
                      print(type(e).__name__, str(e))
          if not ok:
              raise RuntimeError("Ninguna variante devolvio lectura verificable")
          PY
