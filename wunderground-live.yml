name: Actualizar estación Hard Kraft
on:
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * *'
permissions:
  contents: write
concurrency:
  group: hard-kraft-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar y guardar mediciones
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,math
          from datetime import datetime,timezone
          from pathlib import Path
          def num(v):
              return v if type(v) in (int,float) and math.isfinite(v) else None
          key=os.environ.get('WU_API_KEY')
          if not key: raise SystemExit('Falta WU_API_KEY')
          q=urllib.parse.urlencode(dict(stationId='ISANMA322',format='json',units='m',apiKey=key,numericPrecision='decimal'))
          try:
              with urllib.request.urlopen('https://api.weather.com/v2/pws/observations/current?'+q,timeout=25) as r:
                  o=json.load(r)['observations'][0]
          except Exception as e:
              raise SystemExit('Consulta fallida: '+type(e).__name__) from None
          if o.get('stationID')!='ISANMA322': raise SystemExit('Estación incorrecta')
          at=o['obsTimeUtc']; ts=datetime.fromisoformat(at.replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-ts).total_seconds()
          if age < -120: raise SystemExit('Fecha futura incorrecta')
          m=o.get('metric') or {}
          d=dict(station='ISANMA322',at=at,temp=num(m.get('temp')),humidity=num(o.get('humidity')),pressure=num(m.get('pressure')),windSpeed=num(m.get('windSpeed')),windGust=num(m.get('windGust')),windDeg=num(o.get('winddir')),rain=num(m.get('precipTotal')),uv=num(o.get('uv')),solar=num(o.get('solarRadiation')),feelsLike=num(m.get('heatIndex') if (num(m.get('temp')) or 0)>=27 else m.get('windChill')))
          p=Path('datos.json'); h=Path('historial.json')
          rows=json.loads(h.read_text()) if h.exists() else []
          if p.exists():
              old=json.loads(p.read_text())
              if old.get('station')=='ISANMA322' and old.get('at'): rows.append(old)
          rows.append(d)
          rows=sorted({x['at']:x for x in rows if x.get('station')=='ISANMA322'}.values(),key=lambda x:datetime.fromisoformat(x['at'].replace('Z','+00:00')))
          h.write_text(json.dumps(rows,allow_nan=False,separators=(',',':')))
          p.write_text(json.dumps(rows[-1],allow_nan=False))
          print('Lectura:',at,'Antigüedad (min):',round(age/60,1),'Registros:',len(rows))
          PY
      - name: Publicar archivos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos.json historial.json
          git diff --cached --quiet && exit 0
          git commit -m 'Actualizar mediciones e historial Hard Kraft'
          git push
